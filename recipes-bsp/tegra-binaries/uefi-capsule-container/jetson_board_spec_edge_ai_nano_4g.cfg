# Keep the capsule payload specific to the P3767-0004 module.  The Nano 4 GB
# module reports the board spec 3767-301-0004-F.1-1-0.  These fields must match
# the TegraPlatformSpec EFI variable or UEFI cannot select a payload from the
# capsule.  Both aliases source p3768-0000-p3767-0000-a0.conf, which the
# container configures for the CompuLab Edge-AI carrier before generating the
# BUP.
t23x_3767_bl_spec=(
    'boardid=3767;fab=301;boardsku=0004;boardrev=F.1;chiprev=0;chipsku=00:00:00:D6;board=jetson-orin-nano-devkit;rootdev=mmcblk0p1;bup_type=bl'
    'boardid=3767;fab=301;boardsku=0004;boardrev=F.1;chiprev=0;chipsku=00:00:00:D6;board=jetson-orin-nano-devkit-super;rootdev=mmcblk0p1;bup_type=bl'
)
