# The replacement ADI Maxim framework must not load the legacy staging driver.
# This fragment is added only with the Edge-AI ADI v18 profile.
# CONFIG_VIDEO_MAX96712 is not set

CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=m
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_I2C_ATR=m
CONFIG_VIDEO_MAXIM_SERDES=m
CONFIG_VIDEO_MAX96717=m
CONFIG_VIDEO_MAX96724=m
CONFIG_VIDEO_MAX9296A=m
CONFIG_VIDEO_ADV_DEBUG=y
CONFIG_DYNAMIC_DEBUG=y
# Noble hides OF_DYNAMIC unless OF_UNITTEST is enabled. Select the normal
# overlay interface instead, preserving optional-camera metadata pruning.
CONFIG_OF_OVERLAY=y
CONFIG_OF_DYNAMIC=y
