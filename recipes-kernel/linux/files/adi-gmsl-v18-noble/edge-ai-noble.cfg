# Noble-specific Edge-AI baseline, not restricted to the ADI camera profile.
# The wildcard append also adds compulab.cfg, retaining all 23 existing
# peripheral, modem, networking, TI camera and USB-gadget requests.

# Device nodes, firmware loading and storage used by initrd/NVMe boot.
CONFIG_BLK_DEV_INITRD=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FW_LOADER=y
CONFIG_PCI=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCI_MSI=y
CONFIG_PCIE_TEGRA194_HOST=m
CONFIG_BLK_DEV_NVME=m

# Dependencies for the existing Intel/Realtek Ethernet and Intel Wi-Fi options.
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y
CONFIG_NET_VENDOR_INTEL=y
CONFIG_NET_VENDOR_REALTEK=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m

# Bluetooth and CAN userspace tools remain useful with their kernel interfaces.
CONFIG_BT=m
CONFIG_BT_RFCOMM=m
CONFIG_BT_BNEP=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIUART=m
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_DEV=m

# Carrier buses, exposed GPIOs, SPI TPM and serial consoles.
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_TEGRA=y
CONFIG_SPI=y
CONFIG_SPI_TEGRA114=m
CONFIG_SPI_SPIDEV=m
CONFIG_GPIOLIB=y
CONFIG_GPIO_CDEV=y
CONFIG_GPIO_TEGRA=y
CONFIG_GPIO_TEGRA186=y
CONFIG_GPIO_PCA953X=y
CONFIG_GPIO_PCA953X_IRQ=y
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_CORE=m
CONFIG_TCG_TIS_SPI=m
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_TEGRA=y
CONFIG_SERIAL_TEGRA_TCU=y
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_TEGRA=y
CONFIG_WATCHDOG=y

# Host/device USB and composite functions used by recovery and the rootfs.
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_TEGRA=y
CONFIG_USB_GADGET=y
CONFIG_USB_TEGRA_XUDC=m
CONFIG_USB_CONFIGFS=m
CONFIG_USB_CONFIGFS_SERIAL=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y

# Retain GOP/efifb console support until the NVIDIA DRM driver takes over.
# early_tty1 adds fbcon=nodefer; the ordinary vendor takeover policy is kept.
CONFIG_DRM=y
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_HWMON=y
CONFIG_THERMAL=y
CONFIG_REGULATOR=y
CONFIG_COMMON_CLK=y
CONFIG_DMA_SHARED_BUFFER=y
CONFIG_SYNC_FILE=y
