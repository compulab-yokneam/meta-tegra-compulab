# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tegra-compulab"
BBFILE_PATTERN_meta-tegra-compulab = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tegra-compulab = "6"

LAYERDEPENDS_meta-tegra-compulab = "core"
LAYERSERIES_COMPAT_meta-tegra-compulab = "whinlatter wrynose blacksail"

# Weak fallback for distros selecting the provider directly. tegrademo uses
# TEGRA_DEFAULT_KERNEL instead; its Edge-AI default is in the machine include.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-noble-nvidia-tegra"
