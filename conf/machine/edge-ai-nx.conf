#@TYPE: Machine
#@NAME: CompuLab Edge-AI with NVIDIA Jetson Orin NX 8GB/16GB
#@DESCRIPTION: Family image for P3767-0001 and P3767-0000 modules on Edge-AI

# Use the 8 GB module as the conservative first-boot baseline.  The image
# contains both module DTBs and edge-ai-platform-selector switches UEFI to the
# detected module-specific DTB for subsequent boots.
require conf/machine/p3768-0000-p3767-0001.conf
require edge-ai.inc
require edge-ai-nx.inc

MACHINEOVERRIDES := "${@'${MACHINEOVERRIDES}'.replace(':${MACHINE}:edge-ai',':edge-ai:${MACHINE}')}"
MACHINEOVERRIDES .= ":edge-ai-family"

CORE_IMAGE_EXTRA_INSTALL:append = " edge-ai-platform-selector"
