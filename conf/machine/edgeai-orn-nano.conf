#@TYPE: Machine
#@NAME: CompuLab Edge-AI with NVIDIA Jetson Orin Nano 4GB/8GB
#@DESCRIPTION: Family image for P3767-0004 and P3767-0003 modules on Edge-AI

# Use the 4 GB module as the conservative first-boot baseline.  The image
# contains both module DTBs and edgeai-orn-platform-selector switches UEFI to the
# detected module-specific DTB for subsequent boots.
require conf/machine/p3768-0000-p3767-0004.conf
require edgeai-orn.inc
require edgeai-orn-nano.inc

MACHINEOVERRIDES := "${@'${MACHINEOVERRIDES}'.replace(':${MACHINE}:edgeai-orn',':edgeai-orn:${MACHINE}')}"
MACHINEOVERRIDES .= ":edgeai-orn-family"

CORE_IMAGE_EXTRA_INSTALL:append = " edgeai-orn-platform-selector"
