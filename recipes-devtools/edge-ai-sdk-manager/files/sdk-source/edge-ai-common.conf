# Additive R39.2.1 adapter. Keep NVIDIA's partition layouts, module memory
# parameters and BPMP choice. The support installer owns validation of the
# matched Noble kernel/module/DT/initrd set before publishing its marker.
source "${LDK_DIR}/p3768-0000-p3767-0000-super.conf" || exit 1
source "${LDK_DIR}/compulab/boot/firmware.conf" || exit 1
source "${LDK_DIR}/compulab/boot/select-l4t-config.sh" || exit 1
source "${LDK_DIR}/compulab/host/platform-metadata.sh" || exit 1

edge_ai_config_fail()
{
    printf 'Edge-AI configuration: %s\n' "$*" >&2
    exit 1
}

compulab_platform_metadata "${EDGE_AI_EXPECTED_SKU:-}" || \
    edge_ai_config_fail "source a supported Edge-AI board configuration"
# Preserve discovery of actual EEPROM/fuse metadata. Only change the fallback
# chip selection, so offline Nano generation cannot fall back to NX's D3.
DEFAULT_CHIP_SKU="${EDGE_AI_EXPECTED_CHIP_SKU}"
compulab_check_module_metadata || \
    edge_ai_config_fail "conflicting module metadata"
if [ -n "${EDGE_AI_EXPECTED_RAMCODE}" ]; then
    RAMCODE="${RAMCODE:-${EDGE_AI_EXPECTED_RAMCODE}}"
fi

EDGE_AI_EARLY_TTY1="${EDGE_AI_EARLY_TTY1:-0}"
case "${EDGE_AI_EARLY_TTY1}" in
    0|1) ;;
    *) edge_ai_config_fail "EDGE_AI_EARLY_TTY1 must be 0 or 1" ;;
esac

edge_ai_require_staged_assets()
{
    local name
    local marker="${LDK_DIR}/compulab/kernel-release.txt"
    local expected_release="6.8.12-l4t-r39.2.1-1021.21-clab-adi-v18"
    [ -s "${marker}" ] || \
        edge_ai_config_fail "matched Noble artifact marker is missing: ${marker}"
    [ "$(<"${marker}")" = "${expected_release}" ] || \
        edge_ai_config_fail "matched Noble artifact marker has an unsupported release"

    for name in \
        tegra234-edge-ai-gpio-default.dtsi \
        tegra234-edge-ai-pinmux.dtsi \
        tegra234-edge-ai-padvoltage-default.dtsi \
        tegra234-edge-ai-mb2-bct-misc-p3767-0000.dts \
        tegra234-edge-ai-mb1-bct-misc-p3767-0000.dts; do
        [ -s "${LDK_DIR}/bootloader/generic/BCT/${name}" ] || \
            edge_ai_config_fail "missing carrier BCT asset: ${name}"
    done
    [ -s "${DTB_DIR}/${EDGE_AI_DTB_FILE}" ] || \
        edge_ai_config_fail "missing carrier DTB: ${DTB_DIR}/${EDGE_AI_DTB_FILE}"
    [ -s "${LDK_DIR}/kernel/Image" ] && \
        [ -s "${LDK_DIR}/rootfs/boot/Image" ] || \
        edge_ai_config_fail "matched Noble kernel images are missing"
    [ -d "${LDK_DIR}/rootfs/lib/modules/${expected_release}" ] || \
        edge_ai_config_fail "matched Noble module directory is missing"
    [ -s "${LDK_DIR}/rootfs/boot/initrd" ] && \
        [ -s "${LDK_DIR}/bootloader/l4t_initrd.img" ] || \
        edge_ai_config_fail "matched Ubuntu initrds are missing"
}

edge_ai_append_cmdline_arg()
{
    local argument="$1"
    case " ${CMDLINE_ADD:-} " in
        *" ${argument} "*) ;;
        *) CMDLINE_ADD="${CMDLINE_ADD:+${CMDLINE_ADD} }${argument}" ;;
    esac
}

edge_ai_apply_carrier_config()
{
    # Native flash.sh uses MB2_BCT, not the Yocto MB2BCT_CFG variable name.
    MB2_BCT="tegra234-edge-ai-mb2-bct-misc-p3767-0000.dts"
    PINMUX_CONFIG="tegra234-edge-ai-pinmux.dtsi"
    PMC_CONFIG="tegra234-edge-ai-padvoltage-default.dtsi"
    MISC_CONFIG="tegra234-edge-ai-mb1-bct-misc-p3767-0000.dts"
    ODMDATA="gbe-uphy-config-9,hsstp-lane-map-3,hsio-uphy-config-0"
    DTB_FILE="${EDGE_AI_DTB_FILE}"
    TBCDTB_FILE="${DTB_FILE}"

    edge_ai_append_cmdline_arg "iomem=relaxed"
    edge_ai_append_cmdline_arg "pci=realloc"
    edge_ai_append_cmdline_arg "pcie_aspm=off"

    if [ "${EDGE_AI_EARLY_TTY1}" = "1" ]; then
        local argument
        local -a arguments
        read -r -a arguments <<< "${CMDLINE_ADD:-}"
        CMDLINE_ADD=""
        for argument in "${arguments[@]}"; do
            case "${argument}" in
                video=efifb:off|console=tty0) ;;
                *) edge_ai_append_cmdline_arg "${argument}" ;;
            esac
        done
        edge_ai_append_cmdline_arg "console=tty1"
        edge_ai_append_cmdline_arg "fbcon=nodefer"
    fi
}

update_flash_args()
{
    local resolved_board_id="${board_id:-${BOARDID:-}}"
    local resolved_board_sku="${board_sku:-${BOARDSKU:-}}"

    # Validate resolved EEPROM values; never force a different module SKU.
    [ "${resolved_board_id}" = "3767" ] || \
        edge_ai_config_fail "expected BOARDID 3767, got '${resolved_board_id}'"
    [ "${resolved_board_sku}" = "${EDGE_AI_EXPECTED_SKU}" ] || \
        edge_ai_config_fail "expected SKU ${EDGE_AI_EXPECTED_SKU}, got '${resolved_board_sku}'"
    compulab_check_module_metadata || \
        edge_ai_config_fail "conflicting resolved chip/RAM metadata"
    edge_ai_require_staged_assets

    update_flash_args_common "$@" || \
        edge_ai_config_fail "NVIDIA common configuration failed"
    p3767_super_overlay "$@" || \
        edge_ai_config_fail "NVIDIA Super configuration failed"
    [ "${EMC_BCT}" = "${EDGE_AI_EMC_BCT}" ] && \
        [ "${WB0SDRAM_BCT}" = "${EDGE_AI_WB0SDRAM_BCT}" ] || \
        edge_ai_config_fail "NVIDIA memory selection does not match ${EDGE_AI_TARGET}"
    case "${BPFFILE}" in
        "bootloader/bpmp_t234-${EDGE_AI_BPMP_FAMILY}_prod.bin"|\
        "bootloader/bpmp_t234-${EDGE_AI_BPMP_FAMILY}_dev.bin") ;;
        *) edge_ai_config_fail "NVIDIA BPMP selection does not match ${EDGE_AI_TARGET}" ;;
    esac

    # NVIDIA's callbacks overwrite DT/pinmux choices. Apply the carrier
    # overrides last while retaining its correctly selected BPFDTB_FILE.
    edge_ai_apply_carrier_config
    compulab_select_bootloader || \
        edge_ai_config_fail "selected CompuLab UEFI firmware is unavailable"

    # Select only the immutable normal-boot template. Native flash.sh then
    # copies/mutates its working copy; RCM boot.img locking stays separate.
    compulab_select_l4t_config || \
        edge_ai_config_fail "private boot-configuration selection failed"
}

# Some flash.sh paths resolve MISC_CONFIG before calling update_flash_args.
edge_ai_apply_carrier_config
