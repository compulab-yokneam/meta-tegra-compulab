# Source from an Edge-AI profile; invoke only after NVIDIA's late SKU hooks.

compulab_select_bootloader()
{
    local machine style stem relative expected actual
    local manifest="${LDK_DIR}/compulab/boot/SHA256SUMS.firmware"
    local -a inputs=()

    case "${EDGE_AI_EXPECTED_SKU:-}" in
        0000) machine=edge-ai-nx-16g ;;
        0001) machine=edge-ai-nx-8g ;;
        0003) machine=edge-ai-nano-8g ;;
        0004) machine=edge-ai-nano-4g ;;
        *)
            printf '%s\n' 'CompuLab firmware: unsupported or unset module SKU.' >&2
            return 1
            ;;
    esac
    style="${EDGE_AI_UEFI_LOGO_STYLE:-clab-logo}"
    case "$style" in
        clab-logo|nvidia-logo|no-logo) ;;
        *)
            printf 'CompuLab firmware: unsupported logo style: %s\n' "$style" >&2
            return 1
            ;;
    esac
    stem="compulab-${machine}-${style}"
    inputs=(
        "bootloader/uefi_bins/${stem}-uefi.bin"
        "bootloader/uefi_bins/${stem}-rcm.bin"
        "bootloader/${stem}-tos.img"
        "bootloader/${stem}-BOOTAA64.efi"
    )
    if [[ ! -s $manifest ]]; then
        printf '%s\n' 'CompuLab firmware: integrity manifest is missing.' >&2
        return 1
    fi
    for relative in "${inputs[@]}"; do
        if [[ ! -s ${LDK_DIR}/${relative} || -L ${LDK_DIR}/${relative} ]]; then
            printf 'CompuLab firmware: missing regular artifact: %s\n' "$relative" >&2
            return 1
        fi
        expected=$(awk -v name="$relative" '$2 == name {print $1}' "$manifest")
        if [[ ! $expected =~ ^[0-9a-f]{64}$ ]]; then
            printf 'CompuLab firmware: invalid manifest entry for %s\n' "$relative" >&2
            return 1
        fi
        actual=$(sha256sum -- "${LDK_DIR}/${relative}") || return 1
        actual=${actual%% *}
        if [[ $actual != "$expected" ]]; then
            printf 'CompuLab firmware: checksum mismatch for %s\n' "$relative" >&2
            return 1
        fi
    done

    # Never substitute a general UEFI for the minimal recovery firmware.
    # TOS carries the matching Standalone MM; the separate ESP application
    # carries CompuLab's L4TLauncher retry-count change.
    UEFI_IMAGE="${stem}-uefi"
    TBCFILE="${inputs[0]}"
    RCM_TBCFILE="${inputs[1]}"
    UEFIBL="${stem}-uefi_with_dtb.bin"
    RCM_UEFIBL="${stem}-rcm_with_dtb.bin"
    TOSFILE="${inputs[2]}"
    L4T_LAUNCHER="${stem}-BOOTAA64.efi"
    EDGE_AI_UEFI_LOGO_STYLE=$style
}
